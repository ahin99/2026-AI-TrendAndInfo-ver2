name: Sync Notion to GitHub

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-notion:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository checkout
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Gemini SDK install
      - name: Install Gemini SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai

      # 4. Notion -> Markdown
      - name: Sync Notion pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_OUTPUT_DIR: notion-posts
          NOTION_CREATED_DATE_PROPERTY: 생성일
          NOTION_TIMEZONE: Asia/Seoul
        run: |
          python scripts/sync_notion.py

      # 5. 실제 생성된 폴더 구조 확인
      - name: Show Notion folder structure
        run: |
          echo "===== notion-posts directories ====="
          find notion-posts -maxdepth 3 -type d | sort

          echo ""
          echo "===== markdown files ====="
          find notion-posts -maxdepth 3 -type f -name "*.md" | sort

      # 6. Gemini API Key 존재 여부 확인
      # 실제 키 값은 출력하지 않음
      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is not set."
            exit 1
          fi

          echo "GEMINI_API_KEY is configured."

      # 7. Gemini 통합 읽을거리 생성
      - name: Generate weekly AI digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_weekly_digest.py

      # 8. 통합 읽을거리가 실제 생성됐는지 확인
      - name: Verify weekly digest
        run: |
          echo "===== weekly-digests ====="

          if [ ! -d "weekly-digests" ]; then
            echo "ERROR: weekly-digests directory was not created."
            exit 1
          fi

          find weekly-digests -maxdepth 1 -type f -name "*.md" -print

          if ! find weekly-digests -maxdepth 1 -type f -name "*.md" | grep -q .; then
            echo "ERROR: No weekly digest Markdown file was generated."
            exit 1
          fi

          echo "Weekly digest exists."

      # 9. 변경 여부 확인
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 10. Commit & Push
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- notion-posts

          if [ -d "weekly-digests" ]; then
            git add -A -- weekly-digests
          fi

          git commit -m "Sync Notion pages and weekly AI digest"

          git push